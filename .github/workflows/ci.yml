name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bun is the version .bun-version pins, Go the one go.work names: what the
# packages were verified on before they were mirrored.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test

  # Every Go module and app server: formatted, vetted and tested.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: ./check-go

  # The example pair and the apps, driven through a browser: the one check that
  # says the halves still fit together rather than only compiling. An app's
  # suite builds its server first, which takes Go.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: bun install --frozen-lockfile
      - run: bun run e2e:browsers
      - run: bun run e2e
