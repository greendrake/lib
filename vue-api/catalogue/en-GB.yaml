# This package's strings (en-GB), the master every other locale is rendered
# from by fe/lib/translate.yaml. A host serves them merged under its own
# catalogue (@greendrake/i18n), and may reword one by defining its key.
#
# vue-i18n syntax. @:brand.name is the host's name for itself, which every
# host supplies (setupI18n's constants).

connection:
    # Two readings of the same fact — calls cannot get through. Only the device
    # signal tells them apart, which is the whole of what it is trusted for.
    # A linked message must be closed by whitespace: '@:brand.name.' would read
    # the trailing period as part of the key and render the key verbatim.
    device_offline: 'You appear to be offline — waiting for your connection…'
    unreachable: 'Cannot reach @:brand.name — waiting for the connection…'
